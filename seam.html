const c=document.getElementById('view'),ctx=c.getContext('2d'),status=document.getElementById('status'),imgs={};
for(const [k,v] of Object.entries(assets)){const im=new Image();im.onload=draw;im.onerror=()=>status.textContent='FAIL PNG '+k;im.src=v;imgs[k]=im;if(['upper','slope','lower'].includes(k))document.getElementById(k).src=v}
let mode='ground',edges=true,z=2,ox=0,oy=0,drag=null;const pattern=[['grass','moss','grass'],['moss','dirt','grass'],['grass','dirt','moss']];
function iso(x,y){return {x:(x-y)*32*z,y:(x+y)*16*z}}
function paint(k,x,y,w,h){const im=imgs[k];if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h)}
function draw(){if(!c.width)return;const d=devicePixelRatio||1;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#0c1813';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(ox,oy);ctx.scale(d,d);
if(mode==='ground'){for(let sum=0;sum<=4;sum++){for(let y=0;y<3;y++){const x=sum-y;if(x<0||x>=3)continue;const p=iso(x,y),w=64*z,h=32*z;paint(pattern[y][x],p.x-w/2,p.y-h/2,w,h);if(edges){ctx.beginPath();ctx.moveTo(p.x,p.y-h/2);ctx.lineTo(p.x+w/2,p.y);ctx.lineTo(p.x,p.y+h/2);ctx.lineTo(p.x-w/2,p.y);ctx.closePath();ctx.strokeStyle='#f4c978';ctx.lineWidth=1;ctx.stroke()}}}}
else{const pieces=[['upper',0,0],['slope',1,1],['lower',2,2]];for(const [k,x,y] of pieces){const p=iso(x,y),w=110*z;paint(k,p.x-w/2,p.y-w*.62,w,w);if(edges){ctx.strokeStyle='#f4c978';ctx.lineWidth=1;ctx.strokeRect(p.x-w/2,p.y-w*.62,w,w)}}}
ctx.restore();ctx.fillStyle='#eee7d3';ctx.font=12*d+'px system-ui';ctx.fillText(mode==='ground'?'3×3 seam study · NOT real map occupancy':'R02 visual-only · NOT verified ramp geometry',10*d,20*d)}
function center(){const d=devicePixelRatio||1;ox=c.width/2;oy=c.height/2-30*z*d;draw()}
function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);center()}
function setMode(m){mode=m;for(const k of ['ground','r02'])document.getElementById(k).setAttribute('aria-pressed',String(k===m));status.textContent=m==='ground'?'Compare tile cracks and color transitions':'R02 Upper/Slope/Lower: illustrative positions, NOT verified';center()}
document.getElementById('ground').onclick=()=>setMode('ground');document.getElementById('r02').onclick=()=>setMode('r02');
document.getElementById('edge').onclick=()=>{edges=!edges;document.getElementById('edge').textContent='เส้นขอบ '+(edges?'ON':'OFF');document.getElementById('edge').setAttribute('aria-pressed',String(edges));draw()};
document.getElementById('plus').onclick=()=>{z=Math.min(4,z*1.25);center()};document.getElementById('minus').onclick=()=>{z=Math.max(.6,z*.8);center()};document.getElementById('center').onclick=center;
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy}});
c.addEventListener('pointermove',e=>{if(!drag)return;const d=devicePixelRatio||1;ox=drag.ox+(e.clientX-drag.x)*d;oy=drag.oy+(e.clientY-drag.y)*d;draw()});
c.addEventListener('pointerup',()=>drag=null);c.addEventListener('pointercancel',()=>drag=null);addEventListener('resize',resize);resize();status.textContent='6 PNG loaded · '+invariants.nodes+' nodes / '+invariants.edges+' edges (reference only)';
