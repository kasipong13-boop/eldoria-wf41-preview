const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
const nodes=graph.nodes,edges=graph.edges,byId=new Map(nodes.map(n=>[n.id,n])),adj=new Map(nodes.map(n=>[n.id,[]]));
for(const e of edges){if(!byId.has(e.a)||!byId.has(e.b))throw Error('dangling graph edge');adj.get(e.a).push(e.b);adj.get(e.b).push(e.a)}
const images={};for(const [name,src] of Object.entries(assets)){const img=new Image();img.onload=()=>draw();img.src=src;images[name]=img;if(['upper','slope','lower'].includes(name))document.getElementById(name).src=src}
let player=nodes[0],zoom=1.3,ox=0,oy=0,drag=null;
const ordered=nodes.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.elevation-b.elevation);
function project(n){return {x:(n.x-n.y)*32*zoom,y:(n.x+n.y)*16*zoom}}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);center()}
function center(){const p=project(player);ox=canvas.width/2-p.x*devicePixelRatio;oy=canvas.height/2-p.y*devicePixelRatio;draw()}
function draw(){if(!canvas.width)return;const d=devicePixelRatio||1;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0e1b16';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(ox,oy);ctx.scale(d,d);
for(const n of ordered){const p=project(n);const x=p.x-32*zoom,y=p.y-16*zoom;const name=n.kind==='SLOPE'?'dirt':((n.x*7+n.y*11)%9===0?'dirt':(n.x+n.y)%4===0?'moss':'grass');const im=images[name];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,x,y,64*zoom,32*zoom);else{ctx.fillStyle='#477c58';ctx.fillRect(x,y,64*zoom,32*zoom)}}
ctx.strokeStyle='#f2c77b';ctx.lineWidth=Math.max(1,1.2*zoom);ctx.beginPath();for(const e of edges){const a=byId.get(e.a),b=byId.get(e.b),p=project(a),q=project(b);ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y)}ctx.stroke();
const p=project(player);ctx.fillStyle='#ffed86';ctx.strokeStyle='#263629';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y-9*zoom,7*zoom,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
ctx.fillStyle='#e8e8cf';ctx.font=(12*d)+'px system-ui';ctx.fillText('Graph-only art overlay · unknown remains blocked',10*d,20*d)}
function move(dx,dy){const n=(adj.get(player.id)||[]).map(id=>byId.get(id)).find(n=>n.x-player.x===dx&&n.y-player.y===dy);if(!n){status.textContent='BLOCKED: no graph edge. Physical terrain collision NOT VERIFIED';return}player=n;status.textContent='Graph walk ('+n.x+','+n.y+') · '+n.surfaceId+' · height '+n.elevation+' · ART ONLY';center()}
function z(f){zoom=Math.max(.45,Math.min(4,zoom*f));center()}
for(const [id,dx,dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]])document.getElementById(id).onclick=()=>move(dx,dy);
document.getElementById('zin').onclick=()=>z(1.25);document.getElementById('zout').onclick=()=>z(.8);document.getElementById('home').onclick=center;
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy,moved:false}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;ox=drag.ox+dx*devicePixelRatio;oy=drag.oy+dy*devicePixelRatio;draw()});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(moved)return;const x=e.offsetX*devicePixelRatio,y=e.offsetY*devicePixelRatio;let hit=null,dist=Infinity;for(const id of adj.get(player.id)||[]){const n=byId.get(id),p=project(n);const px=p.x*devicePixelRatio+ox,py=p.y*devicePixelRatio+oy;const v=Math.abs(px-x)+Math.abs(py-y);if(v<dist){dist=v;hit=n}}if(hit&&dist<40*zoom*devicePixelRatio){player=hit;status.textContent='Graph tap ('+hit.x+','+hit.y+') '+hit.surfaceId;center()}else status.textContent='BLOCKED: tap only directly connected graph node'});
addEventListener('resize',resize);resize();status.textContent='Loaded '+nodes.length+' nodes / '+edges.length+' edges · P12 design-only';
</script></body></html>
